      ref: "要件定義書テンプレート第13章（テスト観点・受入条件）"

  - id: "QST-009"
    created_at: "2026-01-14"
    title: "外部システム連携の要否"
    content: "Phase1のPoC期間中に、既存システム（CRM、基幹システム、ファイルサーバ等）との連携が必要か、必要な場合は連携方式（API、ファイル連携等）を確認する必要がある"
    context: "要件定義書のインターフェース要件セクションに記載が必要。現状はセキュア領域へのファイルアップロードのみだが、業務シナリオによっては既存システム参照が必要になる可能性がある"
    category: "technical"
    priority: "Low"
    owner: "顧客"
    due: "2026-02-03"
    status: "resolved"
    resolution: "Phase1は外部システム連携を実施しない方針で合意。理由は(1)PoCの目的は機能評価であり連携は本質的評価対象でない、(2)セキュリティ審査（1-2ヶ月）がPoC期間に間に合わない、(3)まずファイルベースでの価値検証を優先。データ提供はファイルアップロード方式（初回一括 + 週次新規追加、IT部門 佐藤課長が管理責任者）。Phase2以降でファイルサーバ連携、CRM連携、基幹システム連携を検討。将来的にはファイルサーバ連携（自動同期）は必須と想定。"
    resolved_at: "2026-01-15"
    resolved_by: "HEAR-005"
