  - id: "QST-007"
    created_at: "2026-01-14"
    title: "対応ブラウザ・デバイス要件"
    content: "AI Workforceを利用する際の対応ブラウザ（Chrome、Edge、Safari等）とそのバージョン、対応デバイス（PC、タブレット、スマートフォン）の制約を明確化する必要がある"
    context: "要件定義書のインターフェース要件セクションに記載が必要。PoC参加者の利用環境を事前に確認し、動作保証範囲を明示する必要がある"
    category: "technical"
    priority: "Medium"
    owner: "LayerX"
    due: "2026-02-03"
    status: "resolved"
    resolution: "対応ブラウザはChrome/Edge 110以降、Safari 16以降。PCは完全対応（推奨解像度1920x1080以上）、タブレットは基本機能のみ（PoCでは検証対象外）、スマホは対応なし。PoCはChrome/Edge最新版 + Windows PCで実施。プロキシ設定済み、ウイルスバスター導入済みで動作確認済み。"
    resolved_at: "2026-01-15"
