  - id: "QST-006"
    created_at: "2026-01-14"
    title: "PoC期間中の稼働時間帯・サポート体制"
    content: "PoC期間中のAI Workforceの稼働時間帯（営業時間のみか24時間か）、メンテナンス時間帯、障害時のLayerXサポート体制（連絡先、対応時間、エスカレーションフロー）を明確化する必要がある"
    context: "要件定義書の非機能要件（可用性・運用保守）セクションに記載が必要。PoC参加者の利用計画とサポート期待値の明確化に必要"
    category: "technical"
    priority: "Medium"
    owner: "LayerX"
    due: "2026-02-03"
    status: "resolved"
    resolution: "24時間365日稼働（PoC参加メンバーの主利用時間は平日9-18時）。定期メンテナンスは毎週日曜3-5時。LayerXサポートは平日9-18時対応（Slack+電話、SLA設定済み：重大障害1時間以内、中程度4時間以内、軽微1営業日以内）。"
    resolved_at: "2026-01-15"
    resolved_by: "HEAR-005"
