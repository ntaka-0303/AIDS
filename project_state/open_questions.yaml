  - id: "QST-008"
    created_at: "2026-01-14"
    title: "PoC受入条件（KPI以外の観点）"
    content: "PoC終了時の受入条件として、KPI達成以外の観点（操作性、エラー発生率、ユーザビリティ評価、データ品質等）を明確化する必要がある"
    context: "要件定義書のテスト観点・受入条件セクションに記載が必要。PoC評価の網羅性を確保し、Phase2移行判断の基準を明確化する"
    category: "scope"
    priority: "Medium"
    owner: "LayerX"
    due: "2026-02-03"
    status: "resolved"
    resolution: "5つの必須項目を設定：(1)KPI達成、(2)システム安定性（重大障害0回、中程度月2回以下、データ損失0件）、(3)データ品質（検索精度80%以上、要約精度平均4.0以上、誤情報5%以下）、(4)ユーザビリティ（アンケート平均3.5以上、業務に役立つ80%以上、重大操作性問題0件）、(5)セキュリティ・コンプライアンス（漏洩・不正アクセス・ポリシー違反すべて0件）。Phase2移行判断は経営会議で決定。特に誤情報生成は経営層の懸念事項であり厳格評価。"
    resolved_at: "2026-01-15"
    resolved_by: "HEAR-005"
    related:
      requirements:
        - "REQ-001"
        - "REQ-002"
        - "REQ-003"
      decisions:
