        - "20260112_初回ヒアリング内容.md"
    source:
      type: "hearing"
      ref: "20260112_初回ヒアリング内容.md"
    notes: "ヒアリングで全員が「抵抗が少ない」ことの重要性を強調。現場参加候補の選定が鍵"
  - id: "RSK-002"
    title: "データソースの統合困難リスク"
    description: "複数のデータソース（10以上のシステム）を統合する際に、技術的困難や制約により統合が進まない可能性がある"
    status: "Open"
    owner: "PMO"
    impact: "中"
    probability: "中"
    score: 4
    early_signals:
      - "データソース一覧の確定が遅延"
      - "技術調査で統合困難なシステムが判明"
      - "データ連携のAPI提供が難しいと判明"
    mitigation_plan:
      - "データソース一覧の早期確定"
      - "技術調査の実施"
      - "段階的に統合対象を拡大"
    contingency_plan:
      - "統合困難なデータソースは対象外とし、優先度の高いものに絞る"
      - "代替手段（手動入力、ファイル取り込みなど）を検討"
