risks:
  - id: "RSK-001"
    title: "現場の抵抗によるPoC失敗リスク"
    description: "現場メンバーがAI導入に抵抗感を示し、PoCへの協力が得られずに失敗する可能性がある"
    status: "Open"
    owner: "PMO"
    impact: "高"
    probability: "中"
    score: 6
    early_signals:
      - "PoC参加メンバーの選定が進まない"
      - "現場からの懸念や不満の声が上がる"
      - "PoC利用率が低い"
    mitigation_plan:
      - "現場が「使ってみたい」と思える領域に絞る"
      - "PoC評価軸として「現場の抵抗が少ない」を重視"
      - "段階的導入により、急激な変化を避ける"
    contingency_plan:
      - "PoC対象領域を再検討"
      - "現場との対話を強化し、懸念を解消"
    due: null
    created_at: "2026-01-16"
    updated_at: "2026-01-16"
    last_reviewed: null
    related:
      requirements: []
      wbs: []
      issues: []
