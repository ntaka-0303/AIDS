      - "情シスとの密な連携"
      - "セキュリティ対策を考慮したアーキテクチャ設計"
    contingency_plan:
      - "制約の範囲内でPoC機能を再設計"
      - "代替データソースの検討"
      - "段階的なアクセス権限の拡大を交渉"
