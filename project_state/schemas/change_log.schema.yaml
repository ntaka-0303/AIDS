# 変更履歴スキーマ定義
# プロジェクトごとにカスタマイズ可能

schema:
  version: "1.1"
  name: "change_log"
  description: |
    変更履歴（起点→反映先の追跡）のスキーマ定義。

    【変更履歴の定義】
    プロジェクト状態ファイル（project_state/）への変更を追跡するログ。
    何がきっかけで、どのファイルのどの項目が変更されたかを記録する。

    【変更履歴の目的】
    - トレーサビリティの確保（ヒアリング→要件→成果物の追跡）
    - 監査対応（いつ、誰が、何を変更したか）
    - 影響分析（ある決定がどのファイルに影響したか）
    - ロールバック支援（変更前の状態の把握）

    【変更履歴に記録されるもの】
    - ヒアリングによる情報追加・更新
    - 決定事項による各種ファイルの変更
    - 課題対応による変更
    - レビュー指摘による修正
    - 手動による変更

    【記録のタイミング】
    - Intakeスキル実行時（ヒアリング取り込み）
    - ProjectMgmtスキル実行時（状態更新）
    - DocGenスキル実行時（ドキュメント生成）
    - 手動でproject_stateを更新した場合

    【重要ルール】
    - 変更履歴は原則として自動生成（Skill実行時）
    - 手動変更時もエントリを追加することを推奨
    - 変更履歴自体の削除・改ざんは禁止
  root_key: entries

# フィールド定義
fields:
  id:
    type: string
    required: true
    pattern: "^CHG-[0-9]{3}$"
    description: "変更ログID"
    example: "CHG-001"
    auto_generate: true

  date:
    type: date
    required: true
    format: "YYYY-MM-DD"
    auto_set: true
    description: "変更日"

  source:
    type: object
    required: true
    properties:
      type:
        type: string
        required: true
        enum:
          - "hearing"   # ヒアリングによる変更
          - "decision"  # 決定事項による変更
          - "issue"     # 課題対応による変更
          - "review"    # レビュー指摘による変更
          - "manual"    # 手動による変更
        description: "変更起点の種別"
      ref:
        type: string
        required: true
        description: "参照元ファイルまたはID"
    description: "変更の起点情報"

  changes:
    type: array
    required: true
    items:
      type: object
      properties:
        target:
          type: string
          required: true
          description: "変更対象ファイルパス"
          example: "project_state/requirements_master.md"
        action:
          type: string
          required: true
          enum:
            - "added"     # 新規追加
            - "modified"  # 更新
            - "removed"   # 削除
            - "replaced"  # 置換
          description: "変更アクション"
        items:
          type: array
          required: false
          items:
            type: string
          description: "変更されたアイテムID（あれば）"
        details:
          type: string
          required: false
          description: "変更の詳細説明"
    description: "変更内容リスト"

  summary:
    type: string
    required: true
    description: "変更サマリ（人間が読む用）"

  actor:
    type: string
    required: false
    enum:
      - "agent"   # エージェントによる自動更新
      - "human"   # 人間による手動更新
    default: "agent"
    description: "変更実行者"

  skill:
    type: string
    required: false
    enum:
      - "intake"           # Intakeスキル
      - "project_mgmt"     # ProjectMgmtスキル
      - "docgen"           # DocGenスキル
      - "quality_gate"     # QualityGateスキル
      - "weekly_report"    # WeeklyReportスキル
      - "manual"           # 手動更新
    description: "実行したスキル"

  related:
    type: object
    required: false
    properties:
      decisions:
        type: array
        items:
          type: string
          pattern: "^DEC-[0-9]{3}$"
        description: "この変更に関連する決定事項"
      issues:
        type: array
        items:
          type: string
          pattern: "^ISS-[0-9]{3}$"
        description: "この変更に関連する課題"
      questions:
        type: array
        items:
          type: string
          pattern: "^QST-[0-9]{3}$"
        description: "この変更に関連する質問"

# ID採番ルール
id_generation:
  format: "CHG-{seq:03d}"
  seq_scope: global

# バリデーションルール
validation:
  reference_integrity:
    - field: source.ref
      conditional: "source.type == 'decision'"
      target_file: decisions.yaml
      target_field: id
      error_message: "参照決定事項{value}が存在しません"
    - field: source.ref
      conditional: "source.type == 'issue'"
      target_file: issues.yaml
      target_field: id
      error_message: "参照課題{value}が存在しません"
    - field: related.decisions
      target_file: decisions.yaml
      target_field: id
      error_message: "関連決定事項{value}が存在しません"
    - field: related.issues
      target_file: issues.yaml
      target_field: id
      error_message: "関連課題{value}が存在しません"
    - field: related.questions
      target_file: open_questions.yaml
      target_field: id
      error_message: "関連質問{value}が存在しません"

  file_existence:
    - field: changes[].target
      check: "file_exists"
      warning_message: "変更対象ファイル{value}が存在しません"

  business_rules:
    - rule: "summary is required"
      error_message: "変更履歴にはsummaryの設定が必要です"
    - rule: "changes is not empty"
      error_message: "変更履歴にはchangesの設定が必要です"

# 自動記録ルール
auto_record:
  triggers:
    - event: "intake_skill_execution"
      source_type: "hearing"
    - event: "wbs_management_skill_execution"
      source_type: "manual"
    - event: "docgen_skill_execution"
      source_type: "manual"

# サンプルデータ
example:
  - id: "CHG-001"
    date: "2026-01-10"
    source:
      type: "hearing"
      ref: "2026-01-10_kickoff.md"
    changes:
      - target: "project_state/requirements_master.md"
        action: "added"
        items:
          - "REQ-001"
          - "REQ-002"
          - "REQ-003"
        details: "キックオフで確認した初期要件を追加"
      - target: "project_state/decisions.yaml"
        action: "added"
        items:
          - "DEC-001"
        details: "認証方式の決定を記録"
      - target: "project_state/open_questions.yaml"
        action: "added"
        items:
          - "QST-001"
          - "QST-002"
        details: "未確認事項を登録"
    summary: "キックオフヒアリングから要件3件、決定1件、質問2件を追加"
    actor: "agent"
    skill: "intake"
    related:
      decisions:
        - "DEC-001"
      issues: []
      questions:
        - "QST-001"
        - "QST-002"
  - id: "CHG-002"
    date: "2026-01-14"
    source:
      type: "manual"
      ref: "週次進捗会議"
    changes:
      - target: "project_state/issues.yaml"
        action: "added"
        items:
          - "ISS-001"
          - "ISS-002"
        details: "進捗会議で発生した課題を登録"
      - target: "project_state/wbs.yaml"
        action: "modified"
        items:
          - "P1-02"
        details: "P1-02をBlocked状態に変更"
    summary: "週次会議から課題2件を追加、WBSタスク1件の状態を更新"
    actor: "agent"
    skill: "project_mgmt"
    related:
      decisions: []
      issues:
        - "ISS-001"
        - "ISS-002"
      questions: []
