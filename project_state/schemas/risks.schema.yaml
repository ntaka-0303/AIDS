# リスク管理スキーマ定義
# プロジェクトごとにカスタマイズ可能

schema:
  version: "1.1"
  name: "risks"
  description: |
    リスク管理のスキーマ定義。

    【リスクの定義】
    将来発生する可能性がある問題・懸念事項。
    発生した場合にプロジェクトに悪影響を与える不確実な事象を管理する。

    【リスクに含まれるもの】
    - スケジュール遅延リスク（レビュー遅延、承認遅延など）
    - リソースリスク（担当者離脱、スキル不足など）
    - 技術リスク（技術的困難、新技術の不確実性など）
    - 外部環境リスク（顧客都合、市場変動など）
    - 品質リスク（要件変更、品質基準未達など）

    【リスクに含まれないもの（誤分類注意）】
    - 既に発生している問題・障害
      → issues.yaml（課題）として登録
      ※リスクが顕在化した場合は、status: Realizedに変更し課題を作成
    - 未決定・確認が必要な事項
      → open_questions.yaml（質問）
    - クライアントの業務上の課題・問題点
      → project_charter.md（背景）またはrequirements_master.md

    【重要ルール】
    - リスクが顕在化（Realized）した場合は、必ず対応する課題（ISS-XXX）を作成
    - スコアはimpact×probabilityで自動計算
    - 定期的なレビュー（last_reviewed）の更新を推奨
  root_key: risks

# フィールド定義
fields:
  id:
    type: string
    required: true
    pattern: "^RSK-[0-9]{3}$"
    description: "リスクID"
    example: "RSK-001"
    auto_generate: true

  title:
    type: string
    required: true
    max_length: 100
    description: "リスクタイトル"

  description:
    type: string
    required: false
    description: "リスクの詳細説明"

  status:
    type: string
    required: true
    enum:
      - "Open"
      - "Monitoring"
      - "Mitigated"
      - "Realized"
      - "Closed"
    default: "Open"
    description: "リスク状態"

  owner:
    type: string
    required: true
    description: "リスクオーナー"

  impact:
    type: string
    required: true
    enum:
      - "高"
      - "中"
      - "低"
    description: "影響度"

  probability:
    type: string
    required: true
    enum:
      - "高"
      - "中"
      - "低"
    description: "発生確率"

  score:
    type: integer
    required: true
    min: 1
    max: 9
    auto_calculate: true
    formula: "impact_value * probability_value"
    description: "リスクスコア（自動計算）"

  early_signals:
    type: array
    required: false
    items:
      type: string
    description: "早期兆候リスト"

  mitigation_plan:
    type: array
    required: false
    items:
      type: string
    description: "予防策（リスク低減策）リスト"

  contingency_plan:
    type: array
    required: false
    items:
      type: string
    description: "発生時対応策リスト"

  due:
    type: date
    required: false
    format: "YYYY-MM-DD"
    description: "対応期限"

  created_at:
    type: date
    required: true
    format: "YYYY-MM-DD"
    auto_set: true
    description: "作成日（自動設定）"

  updated_at:
    type: date
    required: true
    format: "YYYY-MM-DD"
    auto_update: true
    description: "更新日（自動更新）"

  last_reviewed:
    type: date
    required: false
    format: "YYYY-MM-DD"
    description: "最終レビュー日"

  related:
    type: object
    required: false
    properties:
      requirements:
        type: array
        items:
          type: string
          pattern: "^REQ-[0-9]{3}$"
        description: "関連要件ID"
      wbs:
        type: array
        items:
          type: string
          pattern: "^P[0-9]-[0-9]{2}$"
        description: "関連WBSタスクID"
      issues:
        type: array
        items:
          type: string
          pattern: "^ISS-[0-9]{3}$"
        description: "関連課題ID（顕在化時に作成した課題）"
      decisions:
        type: array
        items:
          type: string
          pattern: "^DEC-[0-9]{3}$"
        description: "関連決定事項ID"
      questions:
        type: array
        items:
          type: string
          pattern: "^QST-[0-9]{3}$"
        description: "関連未決事項ID"
      hearings:
        type: array
        items:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}_.*\\.md$"
        description: "関連ヒアリングファイル"

  source:
    type: object
    required: false
    properties:
      type:
        type: string
        enum:
          - "hearing"     # ヒアリングで特定されたリスク
          - "analysis"    # 分析・検討で特定されたリスク
          - "review"      # レビュー時に特定されたリスク
          - "experience"  # 過去の経験から特定されたリスク
          - "manual"      # 手動登録
        description: "リスク発生元の種別"
      ref:
        type: string
        description: "参照元ファイルまたは会議名"

  notes:
    type: string
    required: false
    description: "備考"

# ID採番ルール
id_generation:
  format: "RSK-{seq:03d}"
  seq_scope: global

# 状態遷移ルール
state_transitions:
  Open:
    allowed_next:
      - "Monitoring"
      - "Mitigated"
      - "Realized"
      - "Closed"
  Monitoring:
    allowed_next:
      - "Mitigated"
      - "Realized"
      - "Closed"
  Mitigated:
    allowed_next:
      - "Closed"
      - "Realized"  # 再顕在化
  Realized:
    allowed_next:
      - "Closed"
    actions:
      - type: "create_issue"
        description: "顕在化したリスクは課題として登録必須"
  Closed:
    allowed_next: []
    final: true

# スコア計算
score_calculation:
  impact_values:
    高: 3
    中: 2
    低: 1
  probability_values:
    高: 3
    中: 2
    低: 1
  formula: "impact * probability"
  score_matrix:
    - impact: "高"
      probability: "高"
      score: 9
    - impact: "高"
      probability: "中"
      score: 6
    - impact: "高"
      probability: "低"
      score: 3
    - impact: "中"
      probability: "高"
      score: 6
    - impact: "中"
      probability: "中"
      score: 4
    - impact: "中"
      probability: "低"
      score: 2
    - impact: "低"
      probability: "高"
      score: 3
    - impact: "低"
      probability: "中"
      score: 2
    - impact: "低"
      probability: "低"
      score: 1

# バリデーションルール
validation:
  reference_integrity:
    - field: related.requirements
      target_file: requirements_master.md
      target_pattern: "REQ-[0-9]{3}"
      error_message: "関連要件{value}が存在しません"
    - field: related.wbs
      target_file: wbs.yaml
      target_field: id
      error_message: "関連WBSタスク{value}が存在しません"
    - field: related.issues
      target_file: issues.yaml
      target_field: id
      error_message: "関連課題{value}が存在しません"
    - field: related.decisions
      target_file: decisions.yaml
      target_field: id
      error_message: "関連決定事項{value}が存在しません"
    - field: related.questions
      target_file: open_questions.yaml
      target_field: id
      error_message: "関連未決事項{value}が存在しません"

  date_consistency:
    - rule: "due >= created_at"
      error_message: "期限が作成日より前に設定されています"

  business_rules:
    - rule: "status == 'Realized' implies related.issues is not empty"
      error_message: "顕在化したリスクには対応課題の登録が必要です"
    - rule: "impact and probability are required for score calculation"
      error_message: "スコア計算にはimpactとprobabilityの設定が必要です"

# サンプルデータ
