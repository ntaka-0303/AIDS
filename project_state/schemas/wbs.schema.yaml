# WBS (Work Breakdown Structure) スキーマ定義
# プロジェクトごとにカスタマイズ可能

schema:
  version: "1.1"
  name: "wbs"
  description: |
    WBS（Work Breakdown Structure）タスク管理のスキーマ定義。

    【WBSタスクの定義】
    プロジェクトの作業を階層的に分解した作業単位。
    プロジェクトの目標達成に必要な具体的な作業項目を管理する。

    【WBSタスクに含まれるもの】
    - 成果物作成作業（ドキュメント作成、設計、実装など）
    - レビュー・承認作業（顧客レビュー、内部レビューなど）
    - 準備・調整作業（環境構築、会議調整など）
    - マイルストーン（フェーズ完了、キックオフなど）

    【WBSタスクに含まれないもの（誤分類注意）】
    - プロジェクト推進上の問題・障害
      → issues.yaml（課題）
    - 将来発生しうる懸念事項
      → risks.yaml（リスク）
    - 未決定・確認が必要な事項
      → open_questions.yaml（質問）

    【重要ルール】
    - タスクIDはフェーズ番号+連番（例: P1-01）
    - 依存関係は循環させない
    - 完了したタスクの期限変更は不可
    - Blockedステータスは関連する課題ID（ISS-XXX）と紐付けること
  root_key: tasks

# フィールド定義
fields:
  id:
    type: string
    required: true
    pattern: "^P[0-9]-[0-9]{2}$"
    description: "タスクID（フェーズ+連番）"
    example: "P1-01"
    auto_generate: true

  phase:
    type: string
    required: true
    enum:
      - "提案"
      - "計画"
      - "設計"
      - "実装"
      - "移行"
      - "運用"
    description: "プロジェクトフェーズ"

  title:
    type: string
    required: true
    max_length: 100
    description: "タスクタイトル"

  deliverable:
    type: string
    required: false
    pattern: "^outputs/.*$"
    description: "成果物パス（outputs/配下）"
    example: "outputs/proposal_draft.md"

  owner:
    type: string
    required: true
    description: "担当者"

  status:
    type: string
    required: true
    enum:
      - "Todo"
      - "InProgress"
      - "Done"
      - "Blocked"
    default: "Todo"
    description: "タスク状態"

  due:
    type: date
    required: true
    format: "YYYY-MM-DD"
    description: "期限日"

  depends_on:
    type: array
    required: false
    items:
      type: string
      pattern: "^P[0-9]-[0-9]{2}$"
    description: "依存タスクIDリスト"

  definition_of_done:
    type: array
    required: false
    items:
      type: string
    description: "完了条件リスト"

  created_at:
    type: date
    required: true
    format: "YYYY-MM-DD"
    auto_set: true
    description: "作成日（自動設定）"

  updated_at:
    type: date
    required: true
    format: "YYYY-MM-DD"
    auto_update: true
    description: "更新日（自動更新）"

  notes:
    type: string
    required: false
    description: "備考・補足情報"

  blocker:
    type: object
    required: false
    description: "ブロッカー情報（Blocked状態時）"
    properties:
      issue_id:
        type: string
        pattern: "^ISS-[0-9]{3}$"
        description: "ブロックの原因となる課題ID"
      description:
        type: string
        description: "ブロックの説明"

  related:
    type: object
    required: false
    properties:
      requirements:
        type: array
        items:
          type: string
          pattern: "^REQ-[0-9]{3}$"
        description: "関連要件IDリスト"
      issues:
        type: array
        items:
          type: string
          pattern: "^ISS-[0-9]{3}$"
        description: "関連課題IDリスト"
      risks:
        type: array
        items:
          type: string
          pattern: "^RSK-[0-9]{3}$"
        description: "関連リスクIDリスト"
      decisions:
        type: array
        items:
          type: string
          pattern: "^DEC-[0-9]{3}$"
        description: "関連決定事項IDリスト"
      hearings:
        type: array
        items:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}_.*\\.md$"
        description: "関連ヒアリングファイル"

  source:
    type: object
    required: false
    properties:
      type:
        type: string
        enum:
          - "hearing"     # ヒアリングで特定されたタスク
          - "planning"    # 計画策定時に作成
          - "breakdown"   # 上位タスクの分解
          - "manual"      # 手動追加
        description: "タスク発生元の種別"
      ref:
        type: string
        description: "参照元ファイルまたはID"

# ID採番ルール
id_generation:
  format: "P{phase_num}-{seq:02d}"
  phase_mapping:
    提案: 1
    計画: 2
    設計: 3
    実装: 4
    移行: 5
    運用: 6
  seq_scope: per_phase

# 状態遷移ルール
state_transitions:
  Todo:
    allowed_next:
      - "InProgress"
      - "Blocked"
  InProgress:
    allowed_next:
      - "Done"
      - "Blocked"
  Blocked:
    allowed_next:
      - "InProgress"
      - "Todo"
  Done:
    allowed_next: []
    final: true

# バリデーションルール
validation:
  reference_integrity:
    - field: depends_on
      target_file: wbs.yaml
      target_field: id
      error_message: "依存先タスク{value}が存在しません"
    - field: related.requirements
      target_file: requirements_master.md
      target_pattern: "REQ-[0-9]{3}"
      error_message: "関連要件{value}が存在しません"
    - field: related.issues
      target_file: issues.yaml
      target_field: id
      error_message: "関連課題{value}が存在しません"
    - field: related.risks
      target_file: risks.yaml
      target_field: id
      error_message: "関連リスク{value}が存在しません"
    - field: related.decisions
      target_file: decisions.yaml
      target_field: id
      error_message: "関連決定事項{value}が存在しません"
    - field: blocker.issue_id
      target_file: issues.yaml
      target_field: id
      error_message: "ブロッカー課題{value}が存在しません"

  date_consistency:
    - rule: "depends_on.due <= this.due"
      error_message: "依存先タスクの期限より前に期限が設定されています"
    - rule: "due >= created_at"
      error_message: "期限が作成日より前に設定されています"

  circular_reference:
    field: depends_on
    error_message: "循環依存が検出されました"

  business_rules:
    - rule: "status == 'Blocked' implies blocker is not empty"
      error_message: "Blocked状態にはblockerの設定が必要です"
    - rule: "status == 'Done' implies deliverable file exists or no deliverable"
      error_message: "完了状態のタスクで成果物が見つかりません"

# サンプルデータ
example:
  - id: "P1-01"
    phase: "提案"
    title: "提案書ドラフト作成"
    deliverable: "outputs/proposal_draft.md"
    owner: "PMO"
    status: "InProgress"
    due: "2026-01-20"
    depends_on: []
    definition_of_done:
      - "顧客課題/ToBe/スコープが明記されている"
      - "decisions.yamlと矛盾しない"
      - "内部レビュー完了"
    created_at: "2026-01-10"
    updated_at: "2026-01-14"
    notes: "キックオフヒアリングの内容を反映して作成中"
    blocker: null
    related:
      requirements:
        - "REQ-001"
        - "REQ-002"
      issues: []
      risks:
        - "RSK-001"
      decisions:
        - "DEC-001"
      hearings:
        - "2026-01-10_kickoff.md"
    source:
      type: "planning"
      ref: "プロジェクト計画策定"
  - id: "P1-02"
    phase: "提案"
    title: "顧客レビュー調整"
    deliverable: null
    owner: "PMO"
    status: "Blocked"
    due: "2026-01-25"
    depends_on:
      - "P1-01"
    definition_of_done:
      - "顧客レビュー日程が確定"
      - "レビュー参加者が決定"
    created_at: "2026-01-10"
    updated_at: "2026-01-14"
    notes: null
    blocker:
      issue_id: "ISS-002"
      description: "顧客側レビュー担当者との日程調整が難航"
    related:
      requirements: []
      issues:
        - "ISS-002"
      risks:
        - "RSK-001"
      decisions: []
      hearings: []
    source:
      type: "planning"
      ref: "プロジェクト計画策定"
