  - id: "DEC-022"
    date: "2026-01-15"
    title: "PoC受入条件の確定"
    content: "PoC受入条件として5つの必須項目を設定：(1)KPI達成（既合意の5つのKPI）、(2)システム安定性（重大障害0回、中程度障害月2回以下、データ損失0件）、(3)データ品質（検索精度80%以上、要約精度平均4.0以上、誤情報5%以下）、(4)ユーザビリティ（アンケート平均3.5以上、業務に役立つ80%以上、重大操作性問題0件）、(5)セキュリティ・コンプライアンス（個人情報漏洩0件、不正アクセス0件、ポリシー違反0件）。Phase2移行判断は経営会議で決定。"
    rationale: "特に誤情報生成は経営層の懸念事項であり厳格評価が必要。Phase2移行時には費用対効果も含めた総合的判断を行う。"
