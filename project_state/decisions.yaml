  - id: "DEC-023"
    date: "2026-01-15"
    title: "外部システム連携方針（Phase1は連携なし）"
    content: "Phase1（PoC）では外部システム連携は実施しない。理由は(1)PoCの目的は機能評価でありシステム連携は本質的評価対象ではない、(2)既存システム連携には社内セキュリティ審査（1-2ヶ月）が必要でPoC期間に間に合わない、(3)まずファイルベースでの価値検証を優先し、連携は効果確認後に検討。データ提供はすべてファイルアップロード方式（初回一括 + 週次新規データ追加、IT部門 佐藤課長が管理責任者）。Phase2以降でファイルサーバ連携、CRM連携、基幹システム連携を検討。"
    rationale: "将来的にはファイルサーバ連携（自動同期）は必須と想定するが、まずPoCで基本機能の価値を確認してから投資判断したい。"
