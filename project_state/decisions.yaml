  - id: "DEC-019"
    date: "2026-01-15"
    title: "PoC稼働時間帯とメンテナンス"
    content: "AI Workforceは24時間365日稼働（PoCでも本番環境同様）。PoC参加メンバーの主な利用時間帯は平日9:00-18:00を想定。定期メンテナンスは毎週日曜3:00-5:00を予定。緊急メンテナンスは可能な限り24時間前にメール通知。PoC期間中（平日昼間）の緊急メンテナンスは原則実施しない。"
    rationale: "営業担当の利用時間帯（特に朝夕8:30-9:30と17:00-18:30）の安定稼働を優先。週次MTG前日（木曜夕方）は動作確認のため特に重要。"
