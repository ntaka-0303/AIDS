  - id: "DEC-021"
    date: "2026-01-15"
    title: "対応ブラウザ・デバイス要件"
    content: "対応ブラウザはGoogle Chrome 110以降、Microsoft Edge 110以降、Safari 16以降（macOS Ventura以降）。Firefox対応予定なし。対応デバイスはPC（デスクトップ・ノートPC）完全対応（推奨解像度1920x1080以上、最小1366x768）。タブレットは基本機能のみ対応（閲覧・検索可、提案書作成等複雑操作は制限あり、PoCでは検証対象外）。スマートフォンは対応なし。PoCはChromeまたはEdge最新版 + Windows PCの組み合わせで実施。"
    rationale: "PoC参加メンバー全員がWindows PC（Chrome/Edge標準利用）を使用。プロキシ設定済み、ウイルスバスター導入済みで動作確認済み。"
